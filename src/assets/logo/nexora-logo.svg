<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="emboss" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="6" dy="6" stdDeviation="6" flood-color="#a9a9a9" flood-opacity="0.75"/>
      <feDropShadow dx="-6" dy="-6" stdDeviation="6" flood-color="#f4f4f4" flood-opacity="0.9"/>
    </filter>
    <filter id="textEmboss" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#f2f2f2" flood-opacity="0.9"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#a5a5a5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: rgb(211,211,211). Delete this rect for a transparent logo. -->
  <rect width="640" height="200" fill="rgb(211,211,211)"/>

  <!-- Mark -->
  <g filter="url(#emboss)">
    <rect x="40" y="40" width="120" height="120" rx="30" fill="rgb(211,211,211)"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 128 V72 L122 128 V72"/>
  </g>
  <g fill="#000000">
    <circle cx="78" cy="72" r="8"/>
    <circle cx="122" cy="128" r="8"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="122" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="600" letter-spacing="3" fill="#000000"
        filter="url(#textEmboss)">nexora</text>
</svg>
